<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14100D"/>
      <stop offset="50%" stop-color="#1C1612"/>
      <stop offset="100%" stop-color="#0E0B09"/>
    </linearGradient>

    <!-- Warm Amber Glow -->
    <radialGradient id="amberGlow" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#B5814C" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#D99F50" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Brand Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="30%" stop-color="#E5C28C"/>
      <stop offset="70%" stop-color="#B5814C"/>
      <stop offset="100%" stop-color="#996533"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#amberGlow)"/>

  <!-- Subtle Sand Dune Grid Accent -->
  <circle cx="950" cy="180" r="320" fill="#B5814C" fill-opacity="0.05" filter="blur(60px)"/>
  <circle cx="200" cy="500" r="280" fill="#DEAC62" fill-opacity="0.04" filter="blur(50px)"/>

  <!-- Card Container Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="36" fill="#1C1713" fill-opacity="0.6" stroke="#B5814C" stroke-opacity="0.25" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Logo Mark -->
  <g transform="translate(120, 150) scale(0.085)">
    <path fill="url(#gold)" fill-rule="evenodd" d="M1889.99,1579.72c-101.01,6.82-157.15-183.89-157.15-183.89-163.74-418.741-462.55-489.4-462.55-489.4C1030.34,815.759,825.519,918.3,825.519,918.3c7.825-21.526,77.093-74.152,77.093-74.152C1213.45,691.364,1546.04,944.989,1546.04,944.989c296.98,211.521,385.47,501.261,385.47,501.261C1985.47,1592.57,1889.99,1579.72,1889.99,1579.72ZM1305.87,725.5c-277.9-143.8-501.106,169.064-501.106,169.064s-73.451,100.6-133.43,222.454c-54.219,110.15-118.6,246.18-118.6,246.18-103.081,217.82-225.348,186.86-225.348,186.86-174.893-28.28-100.814-228.38-100.814-228.38s18.661-78.27,145.29-222.46C536.669,911.564,617.962,909.4,617.962,909.4L546.8,1036.94c-74.869,51.9-177.907,174.99-177.907,174.99-133.986,194.84-38.546,204.66-38.546,204.66,69.124,7.23,148.848-148.52,189.767-252.11,75.054-190.014,234.244-394.488,234.244-394.488C1017.7,485.069,1246.57,606.86,1246.57,606.86,1479.51,687.5,1626.1,977.615,1626.1,977.615,1354.98,721.611,1305.87,725.5,1305.87,725.5Z"/>
  </g>

  <!-- Brand Typography -->
  <text x="320" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="78" font-weight="800" fill="#FAF8F5" letter-spacing="-2">mindspace</text>

  <!-- Tagline & Description -->
  <text x="120" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#FAF8F5" letter-spacing="-1">The Intelligent AI Bookmarks &amp; Media Vault</text>
  <text x="120" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#A89F91" letter-spacing="0">Organize web links, social media &amp; articles with Multimodal AI Context, OCR &amp; Reader Mode.</text>

  <!-- Pill Badges -->
  <g transform="translate(120, 485)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="170" height="38" rx="19" fill="#B5814C" fill-opacity="0.2" stroke="#B5814C" stroke-opacity="0.4"/>
    <text x="85" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#E5C28C" text-anchor="middle">✨ Multimodal AI</text>

    <!-- Badge 2 -->
    <rect x="185" y="0" width="160" height="38" rx="19" fill="#B5814C" fill-opacity="0.2" stroke="#B5814C" stroke-opacity="0.4"/>
    <text x="265" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#E5C28C" text-anchor="middle">⚡ Visual OCR</text>

    <!-- Badge 3 -->
    <rect x="360" y="0" width="180" height="38" rx="19" fill="#B5814C" fill-opacity="0.2" stroke="#B5814C" stroke-opacity="0.4"/>
    <text x="450" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#E5C28C" text-anchor="middle">📖 Reader Mode</text>

    <!-- Badge 4 -->
    <rect x="555" y="0" width="190" height="38" rx="19" fill="#B5814C" fill-opacity="0.2" stroke="#B5814C" stroke-opacity="0.4"/>
    <text x="650" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#E5C28C" text-anchor="middle">🔒 Zero-RLS-Leak</text>
  </g>
</svg>
